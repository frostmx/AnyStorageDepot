[AccessTransformers]
; AFGHologram::CheckCanAfford (FGHologram.h:572) is protected, and a pointer-to-member cannot
; be taken from outside the class. It is worth reaching because it answers the question stage 1
; exists for: hologram subclasses override it, so hooking the base implementation shows whether
; they route through it at all. If they do not, the mod has to work through the non-virtual
; ValidatePlacementAndCost (FGHologram.h:214) instead - which is the plan either way.
;
; This is build-time only: the AccessTransformers module is Type "Editor" and none of it ships
; in the cooked mod.
; NB: unlike the Accessor form, Friend matches on the bare class name (EngineName or the
; prefixed one), not on an object path - AccessTransformerTable.GetFor does an exact string
; compare. "/Script/FactoryGame.FGHologram" here is silently unused and fails the build.
Friend=(Class="AFGHologram", FriendClass="FASDHookAccess")
